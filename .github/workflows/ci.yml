name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  front-preset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - run: npm run test:front
      - run: npm install --no-save --legacy-peer-deps eslint@^9.24 @eslint/js@^9.24
      - run: npm run test:front
